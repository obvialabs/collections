# Workflow name
name: tests

# Workflow conditions
on:
  # Run the full test suite for changes pushed to the default branch.
  push:
    branches:
      - master

  # Validate every pull request before it is merged.
  pull_request:

  # Allow manual execution from the GitHub Actions interface.
  workflow_dispatch:

# Grant only the repository permission required by this workflow.
permissions:
  contents: read

# Cancel an older run when a newer commit targets the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow jobs
jobs:
  # Job (Collections)
  collections:
    # Job name shown in GitHub checks: "tests / collections".
    name: collections

    # Use a pinned GitHub-hosted Linux image for reproducible CI behavior.
    runs-on: ubuntu-24.04

    # Prevent a stalled runner from consuming CI indefinitely.
    timeout-minutes: 10

    # Job steps
    steps:
      # Checkout the exact commit that triggered this workflow.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Install the Bun version declared by package.json.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Install development dependencies required by TypeScript and the tests.
      - name: Install dependencies
        run: bun install

      # Validate the source independently from runtime behavior.
      - name: Typecheck source
        run: bun run typecheck

      # Run Bun runtime tests and compile-time type-contract tests.
      - name: Run test suite
        run: bun run test

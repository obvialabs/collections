name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "benchmarks/**"
      - "package.json"
      - "bunfig.toml"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Collection benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Record runner metadata
        run: |
          {
            echo "@obvia/collections benchmark"
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "bun=${{ steps.bun.outputs.bun-version }}"
            echo
          } > benchmark-results.txt

      - name: Run benchmark
        run: bun run benchmark | tee -a benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}
          path: benchmark-results.txt
          retention-days: 30

[test]
# Coverage is requested explicitly through `bun run test:coverage`; ordinary
# test commands stay fast without a global coverage toggle. Do not set
# `coverage = false` here: Bun treats an explicit false value as authoritative
# and it suppresses the CLI `--coverage` flag as well.

# Test files are verification code, not part of the package surface whose
# coverage we want to measure.
coverageSkipTestFiles = true

# The collection package is intentionally small and deterministic enough that
# every executable source path should remain covered. A new uncovered path is
# treated as a test-suite regression rather than accepted as drift.
coverageThreshold = 1.0
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
